[project]
name = "browser-automation-platform"
version = "0.1.0"
description = "Generic visual browser automation platform"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
vision = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
]
gui = [
    "PySide6>=6.6",
]
monitoring = [
    # Optional: enables browser process memory/CPU in resource snapshots.
    # Without it, page/context counts still work; memory/cpu report None.
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration and not load and not stress'"
markers = [
    "integration: exercises a real Playwright browser; run with -m integration",
    "load: multi-session load scenarios; run with -m load",
    "stress: recovery/persistence stress scenarios; run with -m stress",
]
