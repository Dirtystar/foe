[project]
name = "browser-automation-platform"
version = "0.1.0"
description = "Generic visual browser automation platform"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: exercises a real Playwright browser; run with -m integration",
]
