name: FoE Alerting - weekly reminders

# Static WhatsApp reminders + InnoGames KB watcher for the cz8 guild, independent of any
# officer's own PC — no browser, no game session, just stdlib Python and the Green API
# notifier. See browser_automation_platform/ops/reminders/ for the message/page definitions
# and browser_automation_platform/src/bap/alerting/{reminders,newswatch}.py for the logic.
#
# Two schedules: reminders need the 30-min cadence to catch the right day/time slot;
# newswatch only needs to run once a day (events/news come out roughly 2x/14 days, not
# worth checking every 30 min). `bap-alert remind --once` decides whether a reminder is due;
# `bap-alert newswatch --once` checks the two KB pages for new articles not seen before and
# posts them (translated to Czech, best-effort). Both persist their dedup/seen state back via
# a commit below, which is what makes the dedup survive between runs.
#
# Needs three repository secrets: GREEN_API_ID_INSTANCE, GREEN_API_TOKEN, GREEN_API_CHAT_ID.
#
# GitHub disables a scheduled workflow after 60 days with no commits to the repo at all — the
# state commit below (whenever something actually sends) counts as activity, but if 60 days
# pass with nothing due AND no other commits, re-enable it manually under Actions.
on:
  schedule:
    - cron: "0,30 * * * *"   # reminders — every 30 min
    - cron: "0 7 * * *"      # newswatch — once a day, ~8:00 CET / 9:00 CEST
  workflow_dispatch:
    inputs:
      preview_news_url:
        description: "(nothing sent to WhatsApp) preview the composed message for this one KB article URL — takes priority over everything below"
        required: false
        default: ""
      find_chat:
        description: "Find a WhatsApp group's chat_id: type a snippet of its real name here (takes priority over test_message below)"
        required: false
        default: ""
      test_message:
        description: "Send this exact text as a one-off test instead of the normal check (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preview a news message (nothing sent to WhatsApp)
        if: github.event.inputs.preview_news_url != ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
        run: |
          python3 - "${{ github.event.inputs.preview_news_url }}" <<'PYEOF'
          import sys, re, urllib.request
          from bap.alerting.newswatch import BETA_DISCLAIMER, fetch_perex, translate_to_czech

          url = sys.argv[1]
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          body = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
          m = re.search(r"<title>([^<]+)</title>", body)
          title = m.group(1).split(" - ")[0].strip() if m else "?"
          perex = fetch_perex(url)
          title_cs = translate_to_czech(title)
          text = f"\U0001F4F0 {title_cs}"
          if perex:
              text += f"\n{translate_to_czech(perex)}"
          text += f"\n{url}\n{BETA_DISCLAIMER}"
          print("--- preview message (not sent) ---")
          print(text)
          print("-----------------------------------")
          PYEOF

      - name: Find a chat_id by group name
        if: github.event.inputs.preview_news_url == '' && github.event.inputs.find_chat != ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        run: |
          python3 -m bap.alerting check \
            --config ops/reminders/alerting.remind.json \
            --find-chat "${{ github.event.inputs.find_chat }}"

      - name: Send a one-off test message
        if: github.event.inputs.find_chat == '' && github.event.inputs.test_message != ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python3 -m bap.alerting check \
            --config ops/reminders/alerting.remind.json \
            --send "${{ github.event.inputs.test_message }}"

      - name: Check for a due reminder and send it
        if: >-
          github.event.inputs.preview_news_url == '' && github.event.inputs.find_chat == '' &&
          github.event.inputs.test_message == '' &&
          (github.event_name != 'schedule' || github.event.schedule == '0,30 * * * *')
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python3 -m bap.alerting remind \
            --config ops/reminders/alerting.remind.json \
            --reminders ops/reminders/reminders.json \
            --state ops/reminders/reminder_state.json \
            --once

      - name: Check InnoGames KB pages for new articles
        if: >-
          github.event.inputs.preview_news_url == '' && github.event.inputs.find_chat == '' &&
          github.event.inputs.test_message == '' &&
          (github.event_name != 'schedule' || github.event.schedule == '0 7 * * *')
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python3 -m bap.alerting newswatch \
            --config ops/reminders/alerting.remind.json \
            --pages ops/reminders/news_pages.json \
            --state ops/reminders/news_state.json \
            --once

      - name: Persist dedup/seen state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add browser_automation_platform/ops/reminders/reminder_state.json \
                  browser_automation_platform/ops/reminders/news_state.json
          git diff --cached --quiet || git commit -m "reminders: record sent/seen state"
          git diff --cached --quiet || git push
