name: FoE Alerting - weekly reminders

# Static WhatsApp reminders for the cz8 guild, independent of any officer's own PC — no
# browser, no game session, just a stdlib Python script and the Green API notifier.
# See browser_automation_platform/ops/reminders/ for the message definitions and
# browser_automation_platform/src/bap/alerting/reminders.py for the matching logic.
#
# Runs every 30 minutes; `bap-alert remind --once` decides on each run whether anything is
# actually due and sends at most once per reminder per day (ops/reminders/reminder_state.json,
# committed back below, is what makes that dedup survive between runs).
#
# Needs three repository secrets: GREEN_API_ID_INSTANCE, GREEN_API_TOKEN, GREEN_API_CHAT_ID.
#
# GitHub disables a scheduled workflow after 60 days with no commits to the repo at all — the
# state commit below (whenever a reminder actually sends) counts as activity, but if 60 days
# pass with no reminder due AND no other commits, re-enable it manually under Actions.
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      find_chat:
        description: "Find a WhatsApp group's chat_id: type a snippet of its real name here (takes priority over test_message below)"
        required: false
        default: ""
      test_message:
        description: "Send this exact text as a one-off test instead of the normal check (leave empty for a normal run)"
        required: false
        default: ""
      inspect_url:
        description: "(dev diagnostic) fetch this URL and print structural info about it — takes priority over the two inputs above"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: (dev diagnostic) inspect a URL's structure
        if: github.event.inputs.inspect_url != ''
        run: |
          python3 - "${{ github.event.inputs.inspect_url }}" <<'PYEOF'
          import sys, urllib.request
          url = sys.argv[1]
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
          print("LENGTH", len(html))
          needles = ["Halloween Event 2026", "Winter Event 2026",
                     "Great Buildings Prestige redesign", "/articles/", "<article", "<li",
                     "class=\"kb"]
          for n in needles:
              idx = html.find(n)
              print(f"--- {n!r} found at {idx} ---")
              if idx >= 0:
                  print(html[max(0, idx - 400):idx + 400])
          print("--- first 2000 chars ---")
          print(html[:2000])
          PYEOF

      - name: Find a chat_id by group name
        if: github.event.inputs.inspect_url == '' && github.event.inputs.find_chat != ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        run: |
          python3 -m bap.alerting check \
            --config ops/reminders/alerting.remind.json \
            --find-chat "${{ github.event.inputs.find_chat }}"

      - name: Send a one-off test message
        if: github.event.inputs.inspect_url == '' && github.event.inputs.find_chat == '' && github.event.inputs.test_message != ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python3 -m bap.alerting check \
            --config ops/reminders/alerting.remind.json \
            --send "${{ github.event.inputs.test_message }}"

      - name: Check for a due reminder and send it
        if: github.event.inputs.inspect_url == '' && github.event.inputs.find_chat == '' && github.event.inputs.test_message == ''
        working-directory: browser_automation_platform
        env:
          PYTHONPATH: src
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python3 -m bap.alerting remind \
            --config ops/reminders/alerting.remind.json \
            --reminders ops/reminders/reminders.json \
            --state ops/reminders/reminder_state.json \
            --once

      - name: Persist dedup state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add browser_automation_platform/ops/reminders/reminder_state.json
          git diff --cached --quiet || git commit -m "reminders: record sent state"
          git diff --cached --quiet || git push
